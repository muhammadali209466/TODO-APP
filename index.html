<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO APP</title>
    <link rel="stylesheet" href="style.css" />
    <link

      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="

    />
    <link

    />
  </head>
  <body>
    <div
      class="container mt-5 d-flex justify-content-center animate__animated animate__bounce"
    >
      <h1 class="text-center pt-3 fst-italic todoH1">TODO APP</h1>
      <i class="fa-solid fa-2x fa-book m-4 align-content-center todoIcon"></i>
    </div>

    <div class="inputContainer mx-auto mt-5">
      <label class="d-block"> TODO Title </label>
      <input type="text" class="todoInput" id="inputTitle" />

      <label class="d-block"> TODO Description </label>
      <input type="text" class="todoInput" id="inputDescription" />
    </div>
    <div class="mt-4 text-center btnContainer">
      <button class="addBtn" onclick="getTodo()">ADD</button>
      <button class="deleteAllBtn" onclick="deleteAll()">DELETE All</button>
    </div>

  ></script>
  <script src="app.js"></script>
